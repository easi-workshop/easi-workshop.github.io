<!-- Deadline Banner -->

    <strong style="color: white;">📢 Paper Submission Deadline Extended!</strong>
</div> -->

<div class="program-banner has-text-white has-text-centered">
    <strong style="color: white;">📢 Published Workshop Program</strong>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        /* Get all "navbar-burger" elements */
        var $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);
        /* Check if there are any navbar burgers */
        if ($navbarBurgers.length > 0) {
            /* Add a click event on each of them */
            $navbarBurgers.forEach(function ($el) {
                $el.addEventListener('click', function () {
                    /* Get the target from the "data-target" attribute */
                    var target = $el.dataset.target;
                    var $target = document.getElementById(target);
                    /* Toggle the class on both the "navbar-burger" and the "navbar-menu" */
                    $el.classList.toggle('is-active');
                    $target.classList.toggle('is-active');
                });
            });
        }
    });
</script>
<style>
   /* Red deadline bar */
.deadline-banner {
    position: fixed;
    top: 52px; /* height of Bulma navbar */
    width: 100%;
    padding: 8px 0;
    font-size: 16px;
    z-index: 30;
    background-color: rgba(222, 22, 22, 0.6);
}

/* Workshop program banner */
.program-banner {
    position: absolute;
    top: 52px; /* height of Bulma navbar */
    width: 100%;
    padding: 8px 0;
    font-size: 16px;
    z-index: 30;
    background-color: rgba(22, 122, 222, 0.6);
}
</style>
